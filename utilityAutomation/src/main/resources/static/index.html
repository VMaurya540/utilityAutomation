<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utility Automation UI</title>
  <style>
    :root { --bg:#f7f6f2; --card:#ffffff; --ink:#1f2a1f; --accent:#1d6f42; --line:#d9ddd7; }
    body { margin:0; font-family: "Segoe UI", Tahoma, sans-serif; background:linear-gradient(140deg,#f4f8f1,#eef3f8); color:var(--ink); }
    .wrap { max-width:980px; margin:24px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 8px 24px rgba(20,40,25,0.06); }
    h1 { margin:0 0 8px; font-size:24px; }
    h2 { margin:0 0 8px; font-size:18px; }
    .grid { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
    .full { grid-column:1 / -1; }
    label { font-size:13px; font-weight:600; }
    input, textarea { width:100%; box-sizing:border-box; border:1px solid #cfd7cf; border-radius:8px; padding:10px; font-size:13px; }
    textarea { min-height:70px; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-weight:700; cursor:pointer; }
    button:hover { filter:brightness(0.95); }
    pre { white-space:pre-wrap; background:#101b12; color:#ddf3e0; border-radius:8px; padding:12px; min-height:90px; }
    @media (max-width: 820px){ .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Utility Comments Automation</h1>
    <div>Generic local runner + SharePoint integration skeleton.</div>
  </div>

  <div class="card">
    <h2>Local Run</h2>
    <div class="grid">
      <div class="full"><label>Master Tracker Path</label><input id="masterPath" value="C:\\Projects\\boral\\Boral_Retrofitment\\Utility\\Final_Utility_28-02-2025\\Boral_Master_tracker_v3_detailed.xlsx"></div>
      <div class="full"><label>Tracker Path</label><input id="trackerPath" value="C:\\Projects\\boral\\Boral_Retrofitment\\Utility\\Final_Utility_28-02-2025\\Boral_RICE_CEMLI_Tracker_V3.xlsx"></div>
      <div><label>Master Sheet</label><input id="masterSheetName" value="auto"></div>
      <div><label>Tracker Sheet</label><input id="trackerSheetName" value="auto"></div>
      <div><label>Identified By</label><input id="identifiedBy" value="Utility"></div>
      <div><label>Date Format</label><input id="dateFormat" value="dd-MMM-yyyy"></div>
      <div class="full"><label>Allowed Object Types (comma-separated)</label><input id="allowedObjectTypes" value="Package,Package Body,Procedure,View"></div>
      <div><label>Output Tracker Path (optional)</label><input id="outputTrackerPath" placeholder="leave blank to overwrite source"></div>
      <div><label>Output Log Directory (optional)</label><input id="outputDir" placeholder="e.g. C:\\temp\\utility-logs"></div>
      <div><label>Fallback Object Name Only</label><input id="fallbackObjectNameOnly" value="true"></div>
      <div style="display:flex;align-items:end;"><button onclick="runLocal()">Run Local Automation</button></div>
    </div>
  </div>

  <div class="card">
    <h2>SharePoint Skeleton Run</h2>
    <div class="grid">
      <div class="full"><label>Site URL</label><input id="spSiteUrl" placeholder="https://tenant.sharepoint.com/sites/YourSite"></div>
      <div><label>Drive ID</label><input id="spDriveId" placeholder="optional for now"></div>
      <div><label>File Path</label><input id="spFilePath" placeholder="/Shared Documents/Tracker.xlsx"></div>
      <div class="full"><label>Local Working Directory</label><input id="spLocalWorkingDir" placeholder="C:\\temp\\sp-work"></div>
      <div class="full"><label>Note</label><textarea id="spNote" placeholder="anything project-specific"></textarea></div>
      <div><button onclick="runSharePointSkeleton()">Run SharePoint Skeleton</button></div>
    </div>
  </div>

  <div class="card">
    <h2>Response</h2>
    <pre id="result"></pre>
  </div>
</div>

<script>
async function runLocal(){
  const body = {
    masterPath: document.getElementById('masterPath').value,
    trackerPath: document.getElementById('trackerPath').value,
    outputTrackerPath: document.getElementById('outputTrackerPath').value,
    masterSheetName: document.getElementById('masterSheetName').value,
    trackerSheetName: document.getElementById('trackerSheetName').value,
    identifiedBy: document.getElementById('identifiedBy').value,
    dateFormat: document.getElementById('dateFormat').value,
    outputDir: document.getElementById('outputDir').value,
    fallbackObjectNameOnly: String(document.getElementById('fallbackObjectNameOnly').value).toLowerCase() === 'true',
    allowedObjectTypes: document.getElementById('allowedObjectTypes').value
      .split(',').map(x => x.trim()).filter(Boolean)
  };
  await callApi('/api/local-run', body);
}

async function runSharePointSkeleton(){
  const body = {
    siteUrl: document.getElementById('spSiteUrl').value,
    driveId: document.getElementById('spDriveId').value,
    filePath: document.getElementById('spFilePath').value,
    localWorkingDir: document.getElementById('spLocalWorkingDir').value,
    note: document.getElementById('spNote').value
  };
  await callApi('/api/sharepoint-run', body);
}

async function callApi(url, body){
  const out = document.getElementById('result');
  out.textContent = 'Running...';
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e){
    out.textContent = String(e);
  }
}
</script>
</body>
</html>
